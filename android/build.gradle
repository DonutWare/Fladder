allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}

subprojects {
    project.evaluationDependsOn(":app")
}

subprojects {
    if (name == "cronet_http") {
        // Always embed Cronet so no build (including F-Droid) depends on Play Services.
        def defines = (findProperty("dart-defines") ?: "")
            .split(',')
            .findAll { !it.isBlank() }

        def embedded = java.util.Base64.encoder
            .encodeToString("cronetHttpNoPlay=true".getBytes("UTF-8"))

        extensions.extraProperties.set(
            "dart-defines",
            (defines + embedded).join(",")
        )
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
